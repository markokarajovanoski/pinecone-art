# Free Supabase projects pause after 7 days without requests, and the site then shows no
# pieces. This reads the public catalog every 3 days to keep the project awake.
# Set repository variables SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY
# (GitHub → Settings → Secrets and variables → Actions → Variables): the same values as
# .env.local. Both are public, so variables are fine.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the catalog
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository variables."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/categories?select=slug&limit=1"
